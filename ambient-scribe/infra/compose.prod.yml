#
# Modified by Super Protocol, 2026, and most of it is deletion.
#
# Upstream runs five services here: api, ui, an nginx reverse proxy, and — under
# the `riva-nim` profile — `nvcr.io/nim/nvidia/parakeet-1-1b-ctc-en-us` and
# `nvcr.io/nim/nvidia/llama-3.3-nemotron-super-49b-v1`, both of which need an
# `NGC_API_KEY` and, between them, about 400 GB of GPU.
#
# Here there is one service. The API serves the built UI, so the second nginx has
# nothing to proxy; recognition and diarization run inside it on the CPU from
# weights baked into the image, so both NIM services are gone and so is
# `NGC_API_KEY`. What remains external is an OpenAI-compatible generation
# endpoint, which you point `OPENAI_BASE_URL` at — vLLM, llama.cpp, Ollama, or
# in a marketplace deployment the open-weights model server on the card beside
# this pod.
#
# This file is for running the fork on a workstation. A marketplace deployment
# does not use it: see the `confidential-clinical-documentation` chart in
# Super-Protocol/swarm-marketplace-catalog, which also puts an authenticating
# console in front of the API. THERE IS NO AUTHENTICATION IN THIS FILE — bind it
# to loopback and keep it there.

services:
  scribe:
    build:
      context: ../..
      dockerfile: ambient-scribe/infra/docker/scribe.Dockerfile
    image: scribe-server:dev
    restart: unless-stopped
    ports:
      # Loopback only. See the note above.
      - "127.0.0.1:8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - DEBUG=false
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://host.docker.internal:8001/v1}
      - LLM_MODEL=${LLM_MODEL:?set LLM_MODEL to a model your endpoint serves}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - AUDIO_RETENTION_HOURS=${AUDIO_RETENTION_HOURS:-24}
    volumes:
      - scribe_data:/data
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  scribe_data:
    driver: local
